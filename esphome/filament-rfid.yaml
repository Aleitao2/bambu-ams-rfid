esphome:
  name: filament-rfid
  friendly_name: Filament RFID Reader

esp32:
  board: esp32dev
  framework:
    type: arduino

# Required for ESPHome ↔ Home Assistant native API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Filament-RFID Fallback"
    password: !secret fallback_ap_password

logger:
  level: DEBUG  # Change to INFO once working

# SPI bus — VSPI hardware pins
spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

# FM17522 / RC522 reader
rc522_spi:
  cs_pin: GPIO5
  reset_pin: GPIO22
  update_interval: 500ms   # Scan every 500ms — snappy but not spammy

  on_tag:
    then:
      - homeassistant.event:
          event: esphome.filament_tag_scanned
          data:
            tag_uid: !lambda |
              std::string uid = x;
              for (char &c : uid) if (c == ':') c = '-';
              return uid;
      - logger.log:
          format: "Tag scanned: %s"
          args: ['x.c_str()']

  on_tag_removed:
    then:
      - logger.log: "Tag removed"

# Optional: onboard LED to blink on scan (GPIO2 = built-in LED on most ESP32 devboards)
output:
  - platform: gpio
    pin: GPIO2
    id: led_output

light:
  - platform: binary
    name: "RFID Scan LED"
    output: led_output
    id: scan_led